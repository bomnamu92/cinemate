_type: "prompt"
template: |
  당신은 영화 추천 시스템의 조건 업데이트 전문가입니다.

  이전 추천 조건과 사용자 후속 요청을 반영하여 새로운 조건을 생성하세요.

  {format_instructions}

  규칙:
  1. 기존 조건은 유지하되, 변경된 부분만 수정하세요.
  2. 불필요한 조건을 추가하지 마세요.
  3. 반드시 JSON 형식으로만 출력하세요.

  이전 조건:
  {previous_criteria}

  후속 요청:
  {followup_query}
input_variables:
  - "previous_criteria"
  - "followup_query"
partial_variables:
  format_instructions: ""