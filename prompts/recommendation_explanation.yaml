_type: "prompt"
template: |
  당신은 영화 추천 설명 전문가입니다.

  주어진 정보를 바탕으로 해당 영화가 왜 추천되었는지 설명하세요.

  규칙:
  1. 반드시 사용자 요청과 영화 정보에 기반하여 설명하세요.
  2. 제공되지 않은 정보는 만들어내지 마세요.
  3. 2문장 이내로 작성하세요.
  4. 장르, 분위기, 테마 등의 공통점을 언급하세요.
  5. 한국어로 작성하세요.

  사용자 요청:
  {user_query}

  사용자 취향:
  {taste_profile}

  추천 영화 정보:
  {movie_info}
input_variables:
  - "user_query"
  - "taste_profile"
  - "movie_info"